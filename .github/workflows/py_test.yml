# this is an autogenerated file, do not edit it directly or your changes might be lost.
name: Python Tests

on:
  push:
    branches:
      - dev
      - test

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, windows-latest, macOS-latest]
        python-version: ["3.11"]
        os: [macOS-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install Package
        uses: ./.github/actions/install_package
        with:
          python_version: ${{ matrix.python-version }}

      # - name: Run Tests
      #   run: poetry run pytest

      - name: Run Tests (macOS-specific fix)
        if: runner.os == 'macOS'
        run: poetry run pytest --disable-warnings

      - name: Run Tests (Other OS)
        if: runner.os != 'macOS'
        run: poetry run pytest

